name: Playwright Automation Suite - CI

# GitHub Actions solo descubre workflows en .github/workflows/ en la RAÍZ del
# repositorio — por eso este archivo vive aquí y no dentro de
# Playwright-Automation-Suite/, aunque gobierna únicamente ese proyecto (este
# repositorio es un portafolio con varios proyectos independientes). Los
# `paths` filters de abajo evitan que el pipeline corra por cambios en los
# otros proyectos (Jira, Postman), y `working-directory` acota cada `run:` a
# la carpeta del proyecto.

on:
  push:
    branches: ['**']
    paths:
      - 'Playwright-Automation-Suite/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'Playwright-Automation-Suite/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: Playwright-Automation-Suite

jobs:
  ui-and-api-tests:
    name: UI + API tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Playwright-Automation-Suite/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos (TypeScript strict)
        run: npm run typecheck

      - name: Crear carpetas de reportes
        run: mkdir -p reports/html-report reports/junit reports/performance

      - name: Ejecutar pruebas UI (Chromium) + API
        id: tests
        run: npm run test:all
        continue-on-error: true

      - name: Publicar reporte HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: Playwright-Automation-Suite/reports/html-report
          retention-days: 15

      - name: Publicar reporte JUnit como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-report
          path: Playwright-Automation-Suite/reports/junit
          retention-days: 15

      - name: Marcar pipeline como fallido si las pruebas fallaron
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Una o más pruebas fallaron. Revisar el artefacto playwright-html-report."
          exit 1

  performance-test:
    name: Prueba de rendimiento (k6)
    runs-on: ubuntu-latest
    needs: ui-and-api-tests
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Crear carpeta de reportes
        run: mkdir -p reports/performance

      - name: Warm-up del servicio (Restful Booker en Heroku puede estar dormido)
        run: curl -sS https://restful-booker.herokuapp.com/ping || true

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar prueba de carga GET /booking
        run: k6 run performance/load-test-booking.js

      - name: Publicar reporte de performance como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: Playwright-Automation-Suite/reports/performance
          retention-days: 15
